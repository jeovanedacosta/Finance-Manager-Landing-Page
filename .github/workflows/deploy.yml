name: Deploy Landing → AWS S3 + CloudFront

# O deploy só roda quando a variável de repositório DEPLOY_ENABLED for 'true'
# (Settings → Secrets and variables → Actions → Variables).
# Assim os pushes não falham enquanto o bucket e os secrets não existem.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Copia apenas os arquivos publicáveis para uma pasta de saída
      - name: Prepare site
        run: |
          mkdir -p site
          cp -r index.html robots.txt sitemap.xml css js assets site/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.LANDING_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.LANDING_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.LANDING_AWS_REGION }}

      # Assets estáticos com cache longo; HTML, robots e sitemap sem cache
      - name: Deploy to S3
        run: |
          aws s3 sync site/ s3://${{ secrets.LANDING_S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public,max-age=86400" \
            --exclude "index.html" --exclude "robots.txt" --exclude "sitemap.xml"
          for f in index.html robots.txt sitemap.xml; do
            aws s3 cp "site/$f" "s3://${{ secrets.LANDING_S3_BUCKET_NAME }}/$f" \
              --cache-control "no-cache,no-store,must-revalidate"
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.LANDING_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
